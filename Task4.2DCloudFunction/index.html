<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Home Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .room {
      margin-bottom: 20px;
    }

    button {
      margin-right: 10px;
      padding: 10px 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Smart Home Control</h1>

  <div class="room">
    <h3>Living Room</h3>
    <button onclick="sendCommand('living_on')">ON</button>
    <button onclick="sendCommand('living_off')">OFF</button>
  </div>

  <div class="room">
    <h3>Bathroom</h3>
    <button onclick="sendCommand('bathroom_on')">ON</button>
    <button onclick="sendCommand('bathroom_off')">OFF</button>
  </div>

  <div class="room">
    <h3>Closet</h3>
    <button onclick="sendCommand('closet_on')">ON</button>
    <button onclick="sendCommand('closet_off')">OFF</button>
  </div>

  <p id="result">Waiting for command...</p>

  <script>
    function sendCommand(command) {
      fetch("/send", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ command: command })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          document.getElementById("result").innerText = "Command sent successfully: " + command;
        } else {
          document.getElementById("result").innerText = "Error: " + (data.message || data.response);
        }
        console.log(data);
      })
      .catch(error => {
        document.getElementById("result").innerText = "Request failed";
        console.error(error);
      });
    }
  </script>
</body>
</html>
